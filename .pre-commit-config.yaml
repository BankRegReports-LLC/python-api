# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format is deliberately NOT enabled: it would reformat both source
      # files wholesale, burying real diffs in whitespace churn. Adopt it as its
      # own dedicated commit if you want it, not as a side effect of linting.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^bankregreports/
        additional_dependencies: [types-requests]
